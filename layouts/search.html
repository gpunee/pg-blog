{{ define "main" }}
  {{ $fuse := resources.Get "js/fuse.min.js" }}
  {{ $search := resources.Get "js/search.js" | fingerprint }}
  <div class="mw7 center ph3 pt4" id="search-app" data-index="{{ "index.json" | relURL }}">
    <p class="tracked lh-copy">Search across every post by title, tag, category, or content.</p>
    <input
      id="search-input"
      type="search"
      placeholder="Search posts…"
      autocomplete="off"
      class="input-reset ba b--black-20 pa2 mb3 db w-100 f4"
    >
    <ul id="search-results" class="list pl0"></ul>
  </div>
  {{ if $fuse }}
    <script src="{{ $fuse.RelPermalink }}"></script>
  {{ end }}
  {{ if $search }}
    <script src="{{ $search.RelPermalink }}"></script>
  {{ end }}
{{ end }}
